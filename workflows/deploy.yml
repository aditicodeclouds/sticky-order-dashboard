name: Deploy to mybrandbloom.com (SFTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload files via SFTP
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ secrets.FTP_SERVER_DIR }}
          DRY_RUN: "true"
        run: |
          set -eu

          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ] || [ -z "$DIR" ]; then
            echo "One or more required GitHub secrets are missing."
            exit 1
          fi

          lftp -u "$USER","$PASS" "sftp://$HOST:22" -e "
            set cmd:fail-exit yes;
            set sftp:auto-confirm yes;
            set net:timeout 20;
            set net:max-retries 2;
            mirror --reverse --verbose --parallel=4 \
              $( [ "$DRY_RUN" = "true" ] && printf '%s' '--dry-run' ) \
              --exclude-glob .git \
              --exclude-glob .github \
              --exclude-glob README.md \
              ./ \"$DIR\";
            bye
          "